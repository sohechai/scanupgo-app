<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="400" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="f1" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ec4899"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="f2" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f97316"/>
      <stop offset="0.5" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="f3" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#06b6d4"/>
      <stop offset="0.5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="url(#bg)"/>

  <!-- Flyer 3 (back) -->
  <g transform="translate(150 70) rotate(-12)">
    <rect width="120" height="160" rx="8" fill="url(#f3)" opacity="0.9"/>
    <rect x="14" y="18" width="60" height="10" rx="3" fill="#ffffff" opacity="0.85"/>
    <rect x="14" y="34" width="40" height="6" rx="2" fill="#ffffff" opacity="0.5"/>
    <rect x="14" y="120" width="92" height="24" rx="4" fill="#ffffff" opacity="0.2"/>
  </g>

  <!-- Flyer 2 (middle) -->
  <g transform="translate(120 90) rotate(6)">
    <rect width="120" height="160" rx="8" fill="url(#f2)"/>
    <rect x="14" y="18" width="70" height="12" rx="3" fill="#ffffff" opacity="0.9"/>
    <rect x="14" y="36" width="46" height="6" rx="2" fill="#ffffff" opacity="0.5"/>
    <rect x="14" y="120" width="92" height="24" rx="4" fill="#ffffff" opacity="0.2"/>
  </g>

  <!-- Flyer 1 (front) -->
  <g transform="translate(95 80) rotate(-4)">
    <rect width="130" height="172" rx="8" fill="url(#f1)"/>
    <rect x="16" y="20" width="84" height="16" rx="4" fill="#ffffff" opacity="0.95"/>
    <rect x="16" y="42" width="54" height="7" rx="2" fill="#ffffff" opacity="0.55"/>
    <rect x="16" y="56" width="40" height="7" rx="2" fill="#ffffff" opacity="0.4"/>
    <rect x="16" y="128" width="98" height="28" rx="5" fill="#ffffff" opacity="0.22"/>
    <circle cx="100" cy="142" r="9" fill="#ffffff" opacity="0.35"/>
  </g>

  <text x="200" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" opacity="0.7" letter-spacing="2">FLYERS</text>
</svg>
